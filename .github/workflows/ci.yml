name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/generate_benchmark.py
      - run: python -c "import json; d=json.load(open('evals/generated/manifest.json')); assert len(d['cases']) == 50"
